[project]
name = "cc-course-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.23",
    "pypdf>=6.10.0",
    "requests>=2.33.1",
    "soupsieve>=2.5",
    "typer>=0.24.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.8"]
gemini = ["google-genai>=2.25"]
openai = ["openai>=3.19"]
jev = ["typesafe-sdk>=0.7.1"]

[dependency-groups]
dev = [
    "anthropic>=1.8",
    "google-genai>=2.25",
    "httpx>=0.28.0",
    "httpx2>=2.13.1",
    "openai>=3.19",
    "pytest>=9.0.3",
    "typesafe-sdk>=0.7.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
