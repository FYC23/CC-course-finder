<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CC Course Finder</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>CC Course Finder</h1>

  <div id="error-toast"></div>

  <div class="form-row">
    <div class="form-group">
      <label for="school">University</label>
      <select id="school"><option value="">Loading…</option></select>
    </div>
    <div class="form-group">
      <label for="major">Major</label>
      <select id="major" disabled><option value="">Select university first</option></select>
    </div>
    <div class="form-group">
      <label for="term">Term</label>
      <select id="term"></select>
    </div>
    <div class="form-group">
      <label for="requirement">Requirement filter (optional)</label>
      <input type="text" id="requirement" placeholder="e.g. Area C" />
    </div>
    <div class="form-group">
      <label for="status-filter">Availability</label>
      <select id="status-filter">
        <option value="all">All statuses</option>
        <option value="offered">Offered</option>
        <option value="not_offered">Not offered</option>
        <option value="check_failed">Couldn't check</option>
        <option value="articulation_only">Articulation only</option>
      </select>
    </div>
    <div class="form-group">
      <label for="modality-filter">Modality</label>
      <select id="modality-filter">
        <option value="all">Any modality</option>
        <option value="async_online">Online, no set times</option>
        <option value="sync_online">Online, scheduled</option>
        <option value="hybrid">Hybrid</option>
        <option value="in_person">In person</option>
      </select>
    </div>
    <div class="form-group">
      <label for="timezone">My timezone</label>
      <select id="timezone"></select>
    </div>
    <div class="form-group">
      <label for="fit-filter">Hours</label>
      <select id="fit-filter">
        <option value="all">Any hours</option>
        <option value="fits_or_async">Fits my hours or async</option>
        <option value="async">Async only</option>
      </select>
    </div>
    <div class="form-group">
      <label>&nbsp;</label>
      <button id="search-btn" disabled>Search</button>
    </div>
  </div>

  <div id="ingest-bar" style="display:none; margin-bottom:1rem; align-items:center; gap:0.75rem;" class="form-row">
    <span id="staleness-badge" class="badge badge-gray">ASSIST: unknown</span>
    <button id="refresh-btn" type="button" style="background:#64748b;">Refresh ASSIST Data</button>
    <div id="job-status"></div>
  </div>

  <details id="ingest-options" style="margin-bottom:1rem; display:none;">
    <summary style="cursor:pointer; font-size:0.85rem; color:#2563eb;">Advanced ingest options</summary>
    <div class="form-row" style="margin-top:0.5rem;">
      <div class="form-group">
        <label for="max-cc">Max community colleges</label>
        <input type="number" id="max-cc" value="100" min="1" max="200" style="min-width:120px;" />
      </div>
      <div class="form-group">
        <label style="text-transform:none; font-weight:normal;">
          <input type="checkbox" id="allow-non-numeric-keys" style="min-width:auto; margin-right:0.3rem;" />
          Allow non-numeric agreement keys (experimental)
        </label>
      </div>
    </div>
  </details>

  <div id="search-progress" role="status" aria-live="polite">
    <progress id="search-progress-bar" max="1" value="0"></progress>
    <span id="search-progress-text"></span>
  </div>
  <div id="results-count"></div>
  <div id="results-container"></div>

  <script>
    const schoolEl = document.getElementById('school');
    const majorEl = document.getElementById('major');
    const termEl = document.getElementById('term');
    const reqEl = document.getElementById('requirement');
    const statusEl = document.getElementById('status-filter');
    const modalityEl = document.getElementById('modality-filter');
    const fitEl = document.getElementById('fit-filter');
    const timezoneEl = document.getElementById('timezone');
    const searchBtn = document.getElementById('search-btn');
    const toast = document.getElementById('error-toast');
    const countEl = document.getElementById('results-count');
    const container = document.getElementById('results-container');
    const progressEl = document.getElementById('search-progress');
    const progressBar = document.getElementById('search-progress-bar');
    const progressText = document.getElementById('search-progress-text');
    const ingestBar = document.getElementById('ingest-bar');
    const ingestOptionsEl = document.getElementById('ingest-options');
    const stalenessBadgeEl = document.getElementById('staleness-badge');
    const refreshBtn = document.getElementById('refresh-btn');
    const jobStatusEl = document.getElementById('job-status');
    const maxCcEl = document.getElementById('max-cc');
    const allowNonNumericEl = document.getElementById('allow-non-numeric-keys');
    var lastResults = [];
    var searchInProgress = false;
    var activeJobId = null;
    var pollTimer = null;
    var rowsExistForSelection = false;
    var ingestDefaultOptions = { max_cc: 100, allow_non_numeric_keys: false };

    /** Calendar year of the Fall term that starts the active school year (July 1 rollover). */
    function schoolYearFallCalendarYear(d) {
      var y = d.getFullYear();
      var m = d.getMonth();
      if (m >= 6) return y;
      return y - 1;
    }

    /** Pick a sensible default among Fall Y / Spring Y+1 / Summer Y+1. */
    function suggestedTermLabelForSchoolYear(d, fallY) {
      var m = d.getMonth();
      var springY = fallY + 1;
      if (m >= 7 && m <= 9) return 'Fall ' + fallY;
      if (m >= 10 || m <= 3) return 'Spring ' + springY;
      return 'Summer ' + springY;
    }

    /** Chronological order: Spring Y, Summer Y, Fall Y, Spring Y+1, ... */
    function termLabelToChronoIndex(label) {
      var space = label.indexOf(' ');
      var season = label.slice(0, space);
      var year = parseInt(label.slice(space + 1), 10);
      var si = season === 'Spring' ? 0 : season === 'Summer' ? 1 : 2;
      return year * 3 + si;
    }

    function chronoIndexToTermLabel(idx) {
      var seasons = ['Spring', 'Summer', 'Fall'];
      var year = Math.floor(idx / 3);
      var si = idx - year * 3;
      return seasons[si] + ' ' + year;
    }

    function populateTermSelect() {
      var now = new Date();
      var fallY = schoolYearFallCalendarYear(now);
      var def = suggestedTermLabelForSchoolYear(now, fallY);
      var refIdx = termLabelToChronoIndex(def);
      termEl.replaceChildren();
      for (var k = -1; k <= 3; k++) {
        var label = chronoIndexToTermLabel(refIdx + k);
        var opt = document.createElement('option');
        opt.value = label;
        opt.textContent = label;
        if (label === def) opt.selected = true;
        termEl.appendChild(opt);
      }
    }

    function showError(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
    }

    function clearError() {
      toast.style.display = 'none';
      toast.textContent = '';
    }

    function updateSearchBtn() {
      searchBtn.disabled = !(schoolEl.value && majorEl.value && termEl.value.trim() && rowsExistForSelection);
    }

    function setStalenessBadge(text, isStale) {
      stalenessBadgeEl.textContent = text;
      stalenessBadgeEl.classList.toggle('stale', !!isStale);
    }

    function clearJobStatus() {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = null;
      activeJobId = null;
      jobStatusEl.classList.remove('loading');
    }

    async function pollJobStatus() {
      if (!activeJobId) return;
      try {
        const res = await fetch('/api/ingest/status/' + encodeURIComponent(activeJobId));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const status = await res.json();
        if (status.status === 'pending' || status.status === 'running') {
          jobStatusEl.classList.add('loading');
          jobStatusEl.textContent = 'Ingest ' + status.status + '...';
          pollTimer = setTimeout(pollJobStatus, 3000);
          return;
        }

        if (status.status === 'completed') {
          clearJobStatus();
          jobStatusEl.textContent = 'Ingest complete. Rows: ' + status.rows_written;
          await loadFreshnessAndUpdateUI(schoolEl.value, majorEl.value);
          return;
        }

        clearJobStatus();
        jobStatusEl.textContent = 'Ingest failed';
        showError('Ingest failed: ' + (status.error_message || 'Unknown error'));
      } catch (e) {
        clearJobStatus();
        showError('Failed to poll ingest status: ' + e.message);
      }
    }

    async function refreshAssistData() {
      clearError();
      if (!(schoolEl.value && majorEl.value)) return;
      refreshBtn.disabled = true;
      jobStatusEl.classList.add('loading');
      jobStatusEl.textContent = 'Starting ingest...';
      try {
        const res = await fetch('/api/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            target_school: schoolEl.value,
            target_major: majorEl.value,
            options: ingestDefaultOptions,
          }),
        });
        const body = await res.json().catch(function() { return {}; });
        if (!res.ok) throw new Error(body.detail || ('HTTP ' + res.status));
        activeJobId = body.job_id;
        pollTimer = setTimeout(pollJobStatus, 300);
      } catch (e) {
        clearJobStatus();
        showError('Failed to start ingest: ' + e.message);
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function loadFreshnessAndUpdateUI(school, major) {
      clearJobStatus();
      rowsExistForSelection = false;
      updateSearchBtn();
      if (!(school && major)) {
        ingestBar.style.display = 'none';
        ingestOptionsEl.style.display = 'none';
        setStalenessBadge('ASSIST: unknown', false);
        return;
      }

      ingestBar.style.display = 'flex';
      ingestOptionsEl.style.display = 'block';
      setStalenessBadge('ASSIST: checking...', false);
      try {
        const params = new URLSearchParams({
          school: school,
          major: major,
          max_cc: String(ingestDefaultOptions.max_cc),
          allow_non_numeric_keys: String(ingestDefaultOptions.allow_non_numeric_keys),
        });
        const res = await fetch('/api/ingest/check?' + params.toString());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const payload = await res.json();
        rowsExistForSelection = !!payload.rows_exist;
        if (!payload.rows_exist) {
          setStalenessBadge('ASSIST: missing, refresh required', true);
        } else if (payload.freshness) {
          setStalenessBadge(
            'ASSIST: ' + payload.freshness.staleness_label,
            payload.freshness.staleness_seconds >= 86400
          );
        } else {
          setStalenessBadge('ASSIST: unknown freshness', false);
        }
      } catch (e) {
        setStalenessBadge('ASSIST: check failed', true);
        showError('Failed to check ASSIST freshness: ' + e.message);
      }
      updateSearchBtn();
    }

    async function loadSchools() {
      try {
        const res = await fetch('/api/schools');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const schools = await res.json();
        schoolEl.innerHTML = '<option value="">Select university…</option>' +
          schools.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
      } catch (e) {
        showError('Failed to load universities: ' + e.message);
      }
    }

    async function loadMajors(school) {
      majorEl.disabled = true;
      majorEl.innerHTML = '<option value="">Loading…</option>';
      try {
        const res = await fetch('/api/majors?school=' + encodeURIComponent(school));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const majors = await res.json();
        majorEl.innerHTML = '<option value="">Select major…</option>' +
          majors.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
        majorEl.disabled = false;
      } catch (e) {
        showError('Failed to load majors: ' + e.message);
      }
      updateSearchBtn();
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // A course's availability: offered, not offered, couldn't check (the college's
    // schedule lookup failed, see lookup_error), or articulation only (no live schedule).
    function availabilityKey(course) {
      if (course.lookup_error) return 'check_failed';
      if (course.offered_this_term === true) return 'offered';
      if (course.offered_this_term === false) return 'not_offered';
      return 'articulation_only';
    }

    var AVAILABILITY_RANK = { offered: 0, not_offered: 1, check_failed: 2, articulation_only: 3 };

    function availabilityRank(course) {
      return AVAILABILITY_RANK[availabilityKey(course)];
    }

    function makeBadge(colorClass, text) {
      var span = document.createElement('span');
      span.className = 'badge ' + colorClass;
      span.textContent = text;
      return span;
    }

    function offeredBadgeEl(course) {
      var key = availabilityKey(course);
      if (key === 'offered') return makeBadge('badge-green', 'Offered');
      if (key === 'not_offered') return makeBadge('badge-red', 'Not offered');
      if (key === 'articulation_only') return makeBadge('badge-gray', 'Articulation only');
      var wrap = document.createElement('div');
      wrap.appendChild(makeBadge('badge-amber', "Couldn't check"));
      var reason = document.createElement('small');
      reason.className = 'lookup-reason';
      reason.textContent = course.lookup_error;
      wrap.appendChild(reason);
      return wrap;
    }

    var COMMON_TIMEZONES = [
      ['America/Los_Angeles', 'Pacific (California)'],
      ['America/Denver', 'Mountain'],
      ['America/Phoenix', 'Arizona'],
      ['America/Chicago', 'Central'],
      ['America/New_York', 'Eastern'],
      ['America/Anchorage', 'Alaska'],
      ['Pacific/Honolulu', 'Hawaii'],
      ['America/Mexico_City', 'Mexico City'],
      ['America/Sao_Paulo', 'Brazil (São Paulo)'],
      ['Europe/London', 'UK (London)'],
      ['Europe/Paris', 'Central Europe (Paris, Berlin)'],
      ['Asia/Dubai', 'Gulf (Dubai)'],
      ['Asia/Kolkata', 'India'],
      ['Asia/Bangkok', 'Thailand, Vietnam'],
      ['Asia/Jakarta', 'Indonesia (Jakarta)'],
      ['Asia/Shanghai', 'China'],
      ['Asia/Hong_Kong', 'Hong Kong'],
      ['Asia/Taipei', 'Taiwan'],
      ['Asia/Singapore', 'Singapore, Malaysia'],
      ['Asia/Manila', 'Philippines'],
      ['Asia/Seoul', 'Korea'],
      ['Asia/Tokyo', 'Japan'],
      ['Australia/Sydney', 'Australia (Sydney)'],
      ['Pacific/Auckland', 'New Zealand']
    ];

    function utcOffsetLabel(zone) {
      try {
        var parts = new Intl.DateTimeFormat('en-US', { timeZone: zone, timeZoneName: 'shortOffset' })
          .formatToParts(new Date());
        for (var i = 0; i < parts.length; i++) {
          if (parts[i].type === 'timeZoneName') return parts[i].value.replace('GMT', 'UTC');
        }
      } catch (e) { /* older browsers: leave the offset out of the label */ }
      return '';
    }

    function addTimezoneOption(parent, zone, name) {
      var opt = document.createElement('option');
      var offset = utcOffsetLabel(zone);
      opt.value = zone;
      opt.textContent = name + (offset ? ' · ' + offset : '');
      parent.appendChild(opt);
    }

    function populateTimezones(select) {
      var none = document.createElement('option');
      none.value = '';
      none.textContent = "Don't check hours";
      select.appendChild(none);

      var browserZone = '';
      try { browserZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
      var commonZones = COMMON_TIMEZONES.map(function(z) { return z[0]; });

      var common = document.createElement('optgroup');
      common.label = 'Common';
      if (browserZone && commonZones.indexOf(browserZone) === -1) {
        addTimezoneOption(common, browserZone, 'Your timezone (' + browserZone + ')');
      }
      COMMON_TIMEZONES.forEach(function(z) { addTimezoneOption(common, z[0], z[1]); });
      select.appendChild(common);

      if (typeof Intl.supportedValuesOf === 'function') {
        var all = document.createElement('optgroup');
        all.label = 'All timezones';
        Intl.supportedValuesOf('timeZone').forEach(function(zone) {
          if (commonZones.indexOf(zone) === -1 && zone !== browserZone) addTimezoneOption(all, zone, zone);
        });
        select.appendChild(all);
      }
      select.value = browserZone || 'America/Los_Angeles';
    }

    populateTimezones(timezoneEl);

    function sectionPassesFilters(s) {
      if (modalityEl.value !== 'all' && s.modality !== modalityEl.value) return false;
      if (fitEl.value === 'async' && s.fit !== 'async') return false;
      if (fitEl.value === 'fits_or_async' && s.fit !== 'fits' && s.fit !== 'async') return false;
      return true;
    }

    function coursePassesSectionFilters(course) {
      if (modalityEl.value === 'all' && fitEl.value === 'all') return true;
      if (!course.sections || !course.sections.length) return false;
      return course.sections.some(sectionPassesFilters);
    }

    function formatMeeting(m) {
      var days = (m.days && m.days.length) ? m.days.join('') : '';
      var when = (m.start_local && m.end_local) ? (m.start_local + '–' + m.end_local) : 'no set time';
      var where = m.is_online ? 'online' : (m.location || '');
      return [days, when, where].filter(Boolean).join(' · ');
    }

    function fitBadgeEl(fit) {
      var span = document.createElement('span');
      span.className = 'badge';
      if (fit === 'fits') { span.classList.add('badge-green'); span.textContent = 'Fits'; }
      else if (fit === 'async') { span.classList.add('badge-blue'); span.textContent = 'Async'; }
      else if (fit === 'conflicts') { span.classList.add('badge-red'); span.textContent = 'Conflicts'; }
      else { span.classList.add('badge-gray'); span.textContent = fit ? 'Unknown' : '—'; }
      return span;
    }

    function renderSectionsEl(sections) {
      if (!sections.length) {
        return document.createTextNode('');
      }
      var visible = sections.filter(sectionPassesFilters);
      var details = document.createElement('details');
      var summary = document.createElement('summary');
      summary.textContent = visible.length + ' of ' + sections.length + ' section(s) match';
      details.appendChild(summary);

      var table = document.createElement('table');
      table.className = 'sections-table';
      var thead = document.createElement('thead');
      var headRow = document.createElement('tr');
      ['Section', 'Status', 'Modality', 'Meets (campus time)', 'Seats', 'Fit', 'Instructor'].forEach(function(label) {
        var th = document.createElement('th');
        th.textContent = label;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      for (var i = 0; i < visible.length; i++) {
        var s = visible[i];
        var row = document.createElement('tr');
        var meets = (s.meetings || []).map(formatMeeting).join('; ');
        var seats = (s.seats_used != null && s.seats_total != null) ? (s.seats_used + '/' + s.seats_total) : '';
        [s.section_id, s.status, s.modality, meets, seats].forEach(function(value) {
          var td = document.createElement('td');
          td.textContent = value || '';
          row.appendChild(td);
        });
        var fitTd = document.createElement('td');
        fitTd.appendChild(fitBadgeEl(s.fit));
        row.appendChild(fitTd);
        var instrTd = document.createElement('td');
        instrTd.textContent = s.instructor || '';
        row.appendChild(instrTd);
        tbody.appendChild(row);
      }
      table.appendChild(tbody);
      details.appendChild(table);
      return details;
    }

    function makeInfoMessage(message) {
      var p = document.createElement('p');
      p.className = 'results-message';
      p.textContent = message;
      return p;
    }

    function renderResults(results) {
      var openKeys = {};
      container.querySelectorAll('details[open][data-key]').forEach(function(d) {
        openKeys[d.dataset.key] = true;
      });
      container.replaceChildren();
      if (!results.length) {
        countEl.textContent = '';
        container.appendChild(makeInfoMessage(
          searchInProgress ? 'Waiting for the first colleges to answer…' : 'No results found.'));
        return;
      }
      var soFar = searchInProgress ? ' so far' : '';

      var filtered = [];
      for (var i = 0; i < results.length; i++) {
        var item = results[i];
        if ((statusEl.value === 'all' || availabilityKey(item) === statusEl.value)
            && coursePassesSectionFilters(item)) {
          filtered.push(item);
        }
      }

      if (!filtered.length) {
        countEl.textContent = 'Showing 0 of ' + results.length + ' course(s)' + soFar;
        container.appendChild(makeInfoMessage('No matches for current filters.'));
        return;
      }

      countEl.textContent = 'Showing ' + filtered.length + ' of ' + results.length + ' course(s)' + soFar;

      var grouped = {};
      for (var j = 0; j < filtered.length; j++) {
        var course = filtered[j];
        var requirements = course.target_requirements && course.target_requirements.length
          ? course.target_requirements
          : ['Unspecified requirement'];
        for (var k = 0; k < requirements.length; k++) {
          if (!grouped[requirements[k]]) grouped[requirements[k]] = [];
          grouped[requirements[k]].push(course);
        }
      }

      var requirementNames = Object.keys(grouped).sort(function(a, b) {
        return a.localeCompare(b);
      });

      for (var reqIdx = 0; reqIdx < requirementNames.length; reqIdx++) {
        var requirementName = requirementNames[reqIdx];
        var courses = grouped[requirementName];
        courses.sort(function(a, b) {
          var rankDiff = availabilityRank(a) - availabilityRank(b);
          if (rankDiff !== 0) return rankDiff;
          var ccDiff = a.cc_name.localeCompare(b.cc_name);
          if (ccDiff !== 0) return ccDiff;
          return a.course_code.localeCompare(b.course_code);
        });

        var groupSection = document.createElement('section');
        groupSection.className = 'requirement-group';
        var groupHeader = document.createElement('div');
        groupHeader.className = 'requirement-group-header';
        var heading = document.createElement('h2');
        heading.textContent = requirementName;
        var groupCount = document.createElement('span');
        groupCount.className = 'group-count';
        groupCount.textContent = courses.length + ' course(s)';
        groupHeader.appendChild(heading);
        groupHeader.appendChild(groupCount);
        groupSection.appendChild(groupHeader);

        var table = document.createElement('table');
        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        ['CC', 'Course', 'UC Equivalent', 'Offered?', 'Sections'].forEach(function(label) {
          var th = document.createElement('th');
          th.textContent = label;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        for (var courseIdx = 0; courseIdx < courses.length; courseIdx++) {
          var courseRow = courses[courseIdx];
          var courseRequirements = courseRow.target_requirements && courseRow.target_requirements.length
            ? courseRow.target_requirements
            : ['Unspecified requirement'];
          var tr = document.createElement('tr');

          var ccTd = document.createElement('td');
          ccTd.textContent = courseRow.cc_name;
          tr.appendChild(ccTd);

          var courseTd = document.createElement('td');
          var link = document.createElement('a');
          link.href = courseRow.source_url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = courseRow.course_code;
          courseTd.appendChild(link);
          courseTd.appendChild(document.createElement('br'));
          var courseTitle = document.createElement('small');
          courseTitle.textContent = courseRow.course_title;
          courseTd.appendChild(courseTitle);
          var otherRequirements = [];
          for (var otherReqIdx = 0; otherReqIdx < courseRequirements.length; otherReqIdx++) {
            var reqValue = courseRequirements[otherReqIdx];
            if (reqValue !== requirementName) otherRequirements.push(reqValue);
          }
          if (otherRequirements.length) {
            var meta = document.createElement('div');
            meta.className = 'course-meta';
            var metaText = document.createElement('small');
            metaText.textContent = 'Also satisfies: ';
            for (var chipIdx = 0; chipIdx < otherRequirements.length; chipIdx++) {
              var chip = document.createElement('span');
              chip.className = 'req-chip';
              chip.textContent = otherRequirements[chipIdx];
              metaText.appendChild(chip);
              if (chipIdx < otherRequirements.length - 1) {
                metaText.appendChild(document.createTextNode(' '));
              }
            }
            meta.appendChild(metaText);
            courseTd.appendChild(meta);
          }
          tr.appendChild(courseTd);

          var equivalentTd = document.createElement('td');
          equivalentTd.textContent = courseRow.uc_equivalent;
          tr.appendChild(equivalentTd);

          var offeredTd = document.createElement('td');
          offeredTd.appendChild(offeredBadgeEl(courseRow));
          tr.appendChild(offeredTd);

          var sectionsTd = document.createElement('td');
          var sectionsEl = renderSectionsEl(courseRow.sections);
          if (sectionsEl.nodeType === Node.ELEMENT_NODE) {
            var sectionsKey = requirementName + '|' + courseRow.cc_id + '|' + courseRow.course_code;
            sectionsEl.dataset.key = sectionsKey;
            sectionsEl.open = !!openKeys[sectionsKey];
          }
          sectionsTd.appendChild(sectionsEl);
          tr.appendChild(sectionsTd);

          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        groupSection.appendChild(table);
        container.appendChild(groupSection);
      }
    }

    schoolEl.addEventListener('change', function() {
      clearError();
      majorEl.innerHTML = '<option value="">Select major…</option>';
      majorEl.disabled = true;
      rowsExistForSelection = false;
      ingestBar.style.display = 'none';
      ingestOptionsEl.style.display = 'none';
      updateSearchBtn();
      if (schoolEl.value) loadMajors(schoolEl.value);
    });

    majorEl.addEventListener('change', function() {
      clearError();
      loadFreshnessAndUpdateUI(schoolEl.value, majorEl.value);
    });
    termEl.addEventListener('change', updateSearchBtn);
    refreshBtn.addEventListener('click', refreshAssistData);
    maxCcEl.addEventListener('change', function() {
      ingestDefaultOptions.max_cc = parseInt(maxCcEl.value, 10) || 100;
      loadFreshnessAndUpdateUI(schoolEl.value, majorEl.value);
    });
    allowNonNumericEl.addEventListener('change', function() {
      ingestDefaultOptions.allow_non_numeric_keys = !!allowNonNumericEl.checked;
      loadFreshnessAndUpdateUI(schoolEl.value, majorEl.value);
    });
    statusEl.addEventListener('change', function() {
      renderResults(lastResults);
    });
    modalityEl.addEventListener('change', function() { renderResults(lastResults); });
    fitEl.addEventListener('change', function() { renderResults(lastResults); });

    function showProgress(done, total, message) {
      progressEl.style.display = 'flex';
      progressBar.max = Math.max(total, 1);
      progressBar.value = total ? done : 1;
      progressText.textContent = message;
    }

    function readNdjson(res, onEvent) {
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      function emitLines(text) {
        text.split('\n').forEach(function(line) {
          if (line.trim()) onEvent(JSON.parse(line));
        });
      }
      function pump() {
        return reader.read().then(function(chunk) {
          if (chunk.done) {
            emitLines(buffer + decoder.decode());
            return;
          }
          buffer += decoder.decode(chunk.value, { stream: true });
          var cut = buffer.lastIndexOf('\n');
          if (cut >= 0) {
            emitLines(buffer.slice(0, cut));
            buffer = buffer.slice(cut + 1);
          }
          return pump();
        });
      }
      return pump();
    }

    function streamSearch(params) {
      var total = 0;
      var done = 0;
      var finished = false;
      function onEvent(ev) {
        if (ev.type === 'start') {
          total = ev.total;
          lastResults = ev.results;
          showProgress(0, total, total
            ? 'Checking class schedules: 0 of ' + total + ' colleges done'
            : 'No live class schedules to check');
        } else if (ev.type === 'college') {
          done = ev.done;
          lastResults = lastResults.concat(ev.results);
          showProgress(done, total, 'Checking class schedules: ' + done + ' of ' + total + ' colleges done');
        } else if (ev.type === 'done') {
          finished = true;
          searchInProgress = false;
          showProgress(total, total, 'Checked ' + total + ' college schedule(s)');
        } else if (ev.type === 'error') {
          finished = true;
          searchInProgress = false;
          showProgress(done, total, 'Stopped after ' + done + ' of ' + total + ' colleges');
          showError('Search stopped partway: ' + ev.detail + ' Results so far are shown.');
        }
        renderResults(lastResults);
      }
      return fetch('/api/search/stream?' + params).then(function(res) {
        if (!res.ok) {
          return res.json().catch(function() { return {}; }).then(function(body) {
            if (res.status === 409) {
              throw new Error(body.detail || 'Run ASSIST ingest first.');
            }
            throw new Error(body.detail || 'HTTP ' + res.status);
          });
        }
        return readNdjson(res, onEvent).then(function() {
          if (!finished) {
            throw new Error('the connection closed after ' + done + ' of ' + total +
              ' colleges. Results so far are shown.');
          }
        });
      });
    }

    searchBtn.addEventListener('click', function() {
      clearError();
      searchBtn.disabled = true;
      searchBtn.textContent = 'Searching…';
      container.replaceChildren();
      countEl.textContent = '';
      lastResults = [];
      searchInProgress = true;
      showProgress(0, 1, 'Starting search…');
      progressBar.value = 0;
      var params = 'school=' + encodeURIComponent(schoolEl.value) +
        '&major=' + encodeURIComponent(majorEl.value) +
        '&term=' + encodeURIComponent(termEl.value.trim());
      if (reqEl.value.trim()) params += '&requirement=' + encodeURIComponent(reqEl.value.trim());
      if (timezoneEl.value) params += '&tz=' + encodeURIComponent(timezoneEl.value);
      streamSearch(params)
        .catch(function(e) {
          showError('Search failed: ' + e.message);
          if (!lastResults.length) progressEl.style.display = 'none';
        })
        .finally(function() {
          searchInProgress = false;
          renderResults(lastResults);
          searchBtn.disabled = false;
          searchBtn.textContent = 'Search';
          updateSearchBtn();
        });
    });

    populateTermSelect();
    loadSchools();
  </script>
</body>
</html>
